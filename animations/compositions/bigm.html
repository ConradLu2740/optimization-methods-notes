        <div class="badges">

        <div class="formula mono">≤ 加松弛 ｜ ≥ 减剩余再加人工 ｜ = 直接加人工 ｜ 检验数先比 M 系数</div>
      </div>
    </div>

            <div class="std-banner3">
              <div><span class="lbl">min</span> z = -x1 - 3x2 - 4x3</div>
              <div><span class="lbl">s.t.</span> x1 + 2x2 + x3 ≤ 7 ；x1 + 4x2 + x3 ≥ 10 ；x1 + x2 + 4x3 = 7 ；x ≥ 0</div>
            </div>
            <div class="typecard">
              <div class="tcard"><div class="sym">≤</div><div class="tt">加<b>松弛变量</b><br/>系数 +1，费用 0，可留在终表基里</div></div>
              <div class="tcard"><div class="sym">≥</div><div class="tt">减<b>剩余变量</b>（系数 −1）<br/><b>再加人工变量</b>补单位列</div></div>
              <div class="tcard"><div class="sym">=</div><div class="tt">直接<b>加人工变量</b><br/>没有单位列可借</div></div>
            </div>
            <div class="std-banner3" style="margin-top:18px">
              <div><span class="lbl">经济解释</span>：总代价 = 原目标 + M·(a1+a2)。M 充分大 ⇒ 人工变量只要不为 0，目标就爆炸，逼它离基。</div>
            </div>
          </div>
        </div>
        <div class="iter-right3">

              <div class="fnode3 todo"><span class="fn">3</span><div class="ft">迭代：检验数<b>先比 M 系数、再比常数项</b></div></div>
              <div class="fnode3 todo"><span class="fn">4</span><div class="ft">人工变量全离基 且 σ 全 ≥ 0 ⇒ 最优</div></div>
              <div class="fnode3 todo"><span class="fn">5</span><div class="ft">报出 <span class="mono">x*</span> 和 <span class="mono">z*</span></div></div>

          </div>

          </div>
        </div>

          </div>
        </div>

              <div class="fnode3 todo"><span class="fn">3</span><div class="ft">迭代：检验数<b>先比 M 系数、再比常数项</b></div></div>
