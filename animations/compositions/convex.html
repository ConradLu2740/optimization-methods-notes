        <h1>凸集与<span class="hl">凸函数</span></h1>

        <div class="formula mono">凸集：λa + (1−λ)b ∈ S ｜ 凸函数：f(λa+(1−λ)b) ≤ λf(a) + (1−λ)f(b) ｜ 上镜图凸 ⟺ f 凸</div>

      <div class="gridcx">
        <div class="leftcx">
          <div class="panelcx">
            <div class="panel-titlecx mono">复习课题1：用定义验证 S = {(x₁, x₂) : x₂ ≥ |x₁|} 是凸集</div>
            <div class="mathboxcx">
              <div><span class="lbl">任取 a = (a₁, a₂)、b = (b₁, b₂) ∈ S，λ ∈ [0, 1]</span></div>
              <div><span class="lbl">要证：λa + (1−λ)b ∈ S，即</span></div>
              <div>λa₂ + (1−λ)b₂ ≥ |λa₁ + (1−λ)b₁|</div>
            </div>
            <div class="mathboxcx">
              <div><span class="lbl">左边：</span>λa₂ + (1−λ)b₂ ≥ λ|a₁| + (1−λ)|b₁|</div>
              <div><span class="lbl">（因为 a₂ ≥ |a₁|、b₂ ≥ |b₁|，同乘非负系数）</span></div>
              <div><span class="lbl">右边放缩（三角不等式）：</span></div>
              <div>λ|a₁| + (1−λ)|b₁| ≥ |λa₁ + (1−λ)b₁|</div>
            </div>
            <div class="verdictcx ok">两步放缩串起来即得证。<b>第二步的三角不等式正是凸性的来源</b>——这就是这道题的标准写法。</div>
          </div>
        </div>

            <div class="mathboxcx">

              <div><span class="lbl">特征值：</span>0 和 4（迹 4、行列式 0）</div>
            </div>
            <div class="mathboxcx">

            </div>
            <div class="stepcx"><span class="sn">·</span><div class="st">判别顺序：<b>Hessian 半正定最快</b>；一阶/定义法用于证不了二阶的题</div></div>
            <div class="stepcx"><span class="sn">·</span><div class="st"><b>保凸运算</b>：凸函数之和、非负倍数之和仍凸（f₁ + f₂ 那问就是这么证）</div></div>
            <div class="verdictcx warn">易错：算出零特征值时，答案必须写全"<b>凸但非严格凸</b>"——只写"凸"丢一半分。</div>

    <!-- ============ SCENE 4 ============ -->
    <div class="scenecx" id="s4cx">

        <div class="leftcx">

            <div class="panel-titlecx mono">凸集 vs 凸函数：关系只有一条充要条件</div>
            <div class="mathboxcx">
              <div><span class="lbl">上镜图 epi f = {(x, t) : t ≥ f(x)}</span></div>
              <div><span class="hi">epi f 是凸集 ⟺ f 是凸函数</span>　<span class="lbl">（充要）</span></div>
            </div>
            <div class="mathboxcx">
              <div><span class="lbl">水平集 S_α = {x : f(x) ≤ α}：</span></div>
              <div>f 凸 ⇒ S_α 是凸集（<b>必要</b>，非充分）</div>
              <div><span class="lbl">逆过来叫"拟凸"——水平集凸不保证 f 凸</span></div>
            </div>
            <div class="stepcx"><span class="sn">·</span><div class="st">凸函数定义在<b>凸集</b>上才有意义；凸集上凸函数的<b>局部极小即全局极小</b></div></div>
            <div class="stepcx"><span class="sn">·</span><div class="st">凸集本身不要求函数；凸函数必须声明定义域是凸集</div></div>
            <div class="verdictcx ok">一句话：<b>凸集说"线段在里面"，凸函数说"弦在图上"；两者的桥是上镜图。</b></div>
          </div>
        </div>

    <!-- ============ SCENE 5 ============ -->
    <div class="scenecx" id="s5cx">
      <div class="gridcx">
        <div class="leftcx">
          <div class="panelcx">
            <div class="panel-titlecx mono">凸规划：为什么整套理论都建立在凸性上</div>
            <div class="mathboxcx">
              <div><span class="lbl">凸规划 = 目标凸 + 不等式约束 gᵢ 凸（写成 gᵢ(x) ≤ 0）+ 等式约束线性</span></div>
              <div><span class="lbl">可行域是凸集；正则点处 KKT 点即全局最优</span></div>
            </div>
            <div class="stepcx"><span class="sn">1</span><div class="st">无约束：<b>∇f = 0 且 H 正定</b> ⇒ 严格局部极小；凸函数时 ∇f = 0 即全局最优</div></div>
            <div class="stepcx"><span class="sn">2</span><div class="st">有约束：<b>KKT + 凸性</b> ⇒ 全局最优（这就是"KKT 过了就是最小点"的唯一合法场景）</div></div>
            <div class="stepcx"><span class="sn">3</span><div class="st">非凸时 KKT 只是必要条件，必须再过二阶（见动画 04）</div></div>
            <div class="verdictcx ok">三句话收尾：凸集验定义（三角不等式放缩）；凸函数看 Hessian（半正定，零特征值要注明"非严格"）；两者的桥是上镜图，落点是凸规划。</div>
          </div>
        </div>

            <div class="formcardcx"><div class="fh">凸函数三问</div><div class="fl">定义（弦在图上方）｜ 一阶（切线在下方）｜ 二阶（Hessian 半正定）</div></div>
            <div class="formcardcx"><div class="fh">关系三问</div><div class="fl">上镜图凸 ⟺ f 凸｜ 水平集凸仅必要（拟凸）｜ 凸集上凸函数局部 = 全局</div></div>
            <div class="formcardcx"><div class="fh">运算三问</div><div class="fl">和仍凸｜ 非负倍数之和仍凸｜ max{f₁, f₂} 仍凸</div></div>
          </div>
        </div>
      </div>
    </div>
