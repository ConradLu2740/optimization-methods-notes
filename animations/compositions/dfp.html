    <!-- ============ SCENE 1 ============ -->
    <div class="scene7" id="d1">
      <div class="wrap">
        <div class="kicker mono">CH10.4 · DAVIDON-FLETCHER-POWELL · 用梯度差造 Hessian</div>
        <h1>DFP 拟牛<span class="hl">顿法</span></h1>
        <div class="sub">不直接算二阶导数，每步用"位移/梯度差"把 H 校正得更像 A⁻¹</div>
        <div class="badges">
          <span class="badge">割线条件</span>
          <span class="badge hot">老师点名必考</span>
          <span class="badge">二次终止性</span>
        </div>
        <div class="formula mono">d⁽ᵏ⁾ = −Hₖg⁽ᵏ⁾（不是 −g⁽ᵏ⁾）｜ p = xₖ₊₁−xₖ，q = gₖ₊₁−gₖ ｜ 割线条件 p = Hq</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scene7" id="d2">
      <div class="grid7">
        <div class="left7">
          <div class="panel7">
            <div class="panel-title7 mono">例题（讲义例10.4.1）</div>
            <div class="mathbox7">
              <div><span class="lbl">min</span> f = 2x1² + x2² − 4x1 + 2</div>
              <div><span class="lbl">初点</span> x⁽¹⁾ = (2, 1)ᵀ　<span class="lbl">H₁ = I</span></div>
            </div>
            <div class="panel-title7 mono">拟牛顿的三个支点</div>
            <div class="step7"><span class="sn">1</span><div class="st"><b>割线条件 p = Hq</b>：新矩阵必须把"位移"映到"梯度差"上。二次函数里 q = A·p，所以 H 逼近 A⁻¹</div></div>
            <div class="step7"><span class="sn">2</span><div class="st"><b>秩 2 校正</b>：只加两个外积项，不动 H 的对称性，也不破坏正定性（Th10.4.1）</div></div>
            <div class="step7"><span class="sn">3</span><div class="st"><b>共轭性</b>（Th10.4.2）：DFP 连续两步的方向自动 A-共轭 ⇒ 二次函数 n 步终止，且 <span class="mono">Hₙ₊₁ = A⁻¹</span></div></div>
          </div>
        </div>
        <div class="right7">
          <div class="panel7">
            <div class="panel-title7 mono">几何：椭圆等值线，两步到 (1,0)</div>
            <svg width="600" height="520" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <text x="716" y="338" fill="#8fa3c8" font-size="22" text-anchor="end">x1</text>
              <text x="352" y="52" fill="#8fa3c8" font-size="22">x2</text>
              <g fill="none" stroke="#8fa3c8" stroke-width="1.6" stroke-dasharray="8 7">
                <ellipse cx="470" cy="310" rx="87" ry="123"/>
                <ellipse cx="470" cy="310" rx="174" ry="246"/>
                <ellipse cx="470" cy="310" rx="261" ry="369"/>
              </g>
              <text x="540" y="200" fill="#8fa3c8" font-size="20">f = 2</text>
              <text x="620" y="120" fill="#8fa3c8" font-size="20">f = 8</text>
              <circle cx="470" cy="310" r="8" fill="#3ecf8e"/>
              <text x="484" y="336" fill="#3ecf8e" font-size="22">x* = (1, 0)</text>
              <circle id="dstart" cx="610" cy="198" r="9" fill="#ffc53d"/>
              <text x="622" y="192" fill="#ffc53d" font-size="22">x⁽¹⁾=(2,1)</text>
              <line id="dseg1" x1="610" y1="198" x2="428" y2="279" stroke="#ffc53d" stroke-width="3.5"/>
              <line id="dseg2" x1="428" y1="279" x2="470" y2="310" stroke="#ffc53d" stroke-width="3.5" opacity="0"/>
              <polygon id="dah2" points="470,310 442,300 446,326" fill="#ffc53d" opacity="0"/>
              <circle id="dmid" cx="428" cy="279" r="7" fill="#ffc53d" opacity="0"/>
              <text id="dmidl" x="330" y="272" fill="#ffc53d" font-size="21" opacity="0">x⁽²⁾=(8/9, 4/9)</text>
              <text id="dd1" x="560" y="300" fill="#ffc53d" font-size="21">d⁽¹⁾</text>
              <text id="dd2" x="392" y="360" fill="#ffc53d" font-size="21" opacity="0">d⁽²⁾</text>
            </svg>
            <div style="font-size:25px;line-height:1.6;color:#e9eef8;margin-top:12px">第一步和共轭梯度一样是负梯度；第二步开始，<b style="color:#ffc53d;font-weight:400">H₂ 已经"记得"A 的形状</b>，方向直接指向解。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 3 ============ -->
    <div class="scene7" id="d3">
      <div class="grid7">
        <div class="left7">
          <div class="panel7">
            <div class="panel-title7 mono">迭代 ①（H₁ = I，等价于最速下降）</div>
            <div class="mathbox7">
              <div><span class="lbl">g⁽¹⁾ = ∇f = (4x1−4, 2x2)ᵀ =</span> (4, 2)ᵀ</div>
              <div><span class="lbl">d⁽¹⁾ = −H₁g⁽¹⁾ =</span> (−4, −2)ᵀ</div>
            </div>
            <div class="mathbox7">
              <div><span class="lbl">λ₁ = −gᵀd / (dᵀAd) = 20 / 72 =</span> <span class="hi">5/18</span></div>
            </div>
            <div class="mathbox7">
              <div><span class="lbl">x⁽²⁾ =</span> (2, 1) + (5/18)(−4, −2) = <span class="hi">(8/9, 4/9)ᵀ</span></div>
              <div><span class="lbl">g⁽²⁾ =</span> (−4/9, 8/9)ᵀ</div>
            </div>
            <div class="verdict7 warn">关键区别：共轭梯度用 <span class="mono">d = −g + βd₍上一步₎</span>；拟牛顿用 <span class="mono">d = −Hₖg</span>。第一迭代 H₁ = I 时两者相同，之后分道扬镳。</div>
          </div>
        </div>
        <div class="right7">
          <div class="panel7">
            <div class="panel-title7 mono">几何：沿 d⁽¹⁾ 切到等值线</div>
            <svg width="600" height="520" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <g fill="none" stroke="#8fa3c8" stroke-width="1.5" stroke-dasharray="8 7">
                <ellipse cx="470" cy="310" rx="87" ry="123"/><ellipse cx="470" cy="310" rx="174" ry="246"/>
              </g>
              <circle cx="470" cy="310" r="8" fill="#3ecf8e"/>
              <circle cx="610" cy="198" r="9" fill="#ffc53d"/>
              <line x1="610" y1="198" x2="428" y2="279" stroke="#ffc53d" stroke-width="4"/>
              <polygon points="428,279 458,266 450,246" fill="#ffc53d"/>
              <circle cx="428" cy="279" r="8" fill="#ffc53d"/>
              <text x="330" y="300" fill="#ffc53d" font-size="22">x⁽²⁾ = (8/9, 4/9)</text>
              <text x="622" y="192" fill="#ffc53d" font-size="21">x⁽¹⁾</text>
              <ellipse cx="428" cy="279" rx="70" ry="99" fill="none" stroke="#ffc53d" stroke-width="2.5"/>
              <text x="340" y="400" fill="#ffc53d" font-size="20">f = 2/9</text>
            </svg>
            <div style="font-size:25px;line-height:1.6;color:#e9eef8;margin-top:12px">一维搜索走到与等值线相切：该点处 <span class="mono">g⁽²ᵀd⁽¹⁾ = 0</span>。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 4 ============ -->
    <div class="scene7" id="d4">
      <div class="grid7">
        <div class="left7">
          <div class="panel7">
            <div class="panel-title7 mono">DFP 校正：用 p、q 更新 H</div>
            <div class="mathbox7">
              <div><span class="lbl">p = x⁽²⁾ − x⁽¹⁾ =</span> (−10/9, −5/9)ᵀ</div>
              <div><span class="lbl">q = g⁽²⁾ − g⁽¹⁾ =</span> (−40/9, −10/9)ᵀ</div>
            </div>
            <div class="mathbox7">
              <div><span class="lbl">H₂ = H₁ + ppᵀ/(pᵀq) − (H₁q)(H₁q)ᵀ/(qᵀH₁q)</span></div>
              <div><span class="lbl">pᵀq =</span> 50/9　<span class="lbl">qᵀH₁q =</span> 1700/81</div>
            </div>
            <div class="mathbox7" style="text-align:center">
              <div class="mtxbox">H₂ = [ 43/153　−19/153 ]<br/>　　　[ −19/153　305/306 ]</div>
            </div>
            <div class="step7"><span class="sn">✓</span><div class="st">验证割线条件：<span class="mono">H₂q = (−10/9, −5/9)ᵀ = p ✓</span></div></div>
            <div class="step7"><span class="sn">✓</span><div class="st">H₂ 仍<b>对称正定</b>（det ≈ 0.265 &gt; 0）⇒ 下降方向有保证（Th10.4.1）</div></div>
          </div>
        </div>
        <div class="right7">
          <div class="panel7">
            <div class="panel-title7 mono">校正公式在干什么</div>
            <div class="formcard7">
              <div class="fh">第一项 ppᵀ/(pᵀq)</div>
              <div class="fl">沿"新位移方向"加正定质量——H 在新方向上变大</div>
            </div>
            <div class="formcard7">
              <div class="fh">第二项 (Hq)(Hq)ᵀ/(qᵀHq)</div>
              <div class="fl">沿"旧估计的梯度差方向"减质量——一加一减，正好把 Hq 扭成 p</div>
            </div>
            <div class="formcard7">
              <div class="fh">为什么不动正定性</div>
              <div class="fl">两项都是对称秩 1 外积，方向选取保证校正后的矩阵对任意 z 都有 zᵀH₂z &gt; 0（讲义 Th10.4.1 的 Schwartz 证明）</div>
            </div>
            <div class="verdict7 warn" style="margin-top:16px">易错：<b>p、q 别写反</b>（p 是位移、q 是梯度差）；H₁ 默认 <b>I</b>；分母 pᵀq、qᵀH₁q 别混。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scene7" id="d5">
      <div class="grid7">
        <div class="left7">
          <div class="panel7">
            <div class="panel-title7 mono">迭代 ②：H₂ 已逼近 A⁻¹</div>
            <div class="mathbox7">
              <div><span class="lbl">d⁽²⁾ = −H₂g⁽²⁾ =</span> <span class="hi">(4/17, −16/17)ᵀ</span></div>
              <div><span class="lbl">（对照：纯最速下降会走 −g⁽²⁾ = (4/9, −8/9)）</span></div>
            </div>
            <div class="mathbox7">
              <div><span class="lbl">λ₂ = −gᵀd / (dᵀAd) =</span> <span class="hi">17/36</span></div>
            </div>
            <div class="mathbox7">
              <div><span class="lbl">x⁽³⁾ =</span> (8/9, 4/9) + (17/36)(4/17, −16/17) = <span class="hi">(1, 0)ᵀ</span></div>
              <div><span class="lbl">g⁽³⁾ = (0, 0)ᵀ ⇒ 终止</span>　<span class="lbl">f* =</span> 0</div>
            </div>
            <div class="verdict7 ok"><b>Th10.4.2 + 推论</b>：二次凸函数上 DFP 具有共轭性，n 步终止；且 <span class="mono">H₃ = A⁻¹ = diag(1/4, 1/2)</span>（本题 A = diag(4,2)）。</div>
          </div>
        </div>
        <div class="right7">
          <div class="panel7">
            <div class="panel-title7 mono">几何：两步路径</div>
            <svg width="600" height="520" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <g fill="none" stroke="#8fa3c8" stroke-width="1.5" stroke-dasharray="8 7">
                <ellipse cx="470" cy="310" rx="87" ry="123"/><ellipse cx="470" cy="310" rx="174" ry="246"/>
              </g>
              <line x1="610" y1="198" x2="428" y2="279" stroke="#ffc53d" stroke-width="3.5"/>
              <line x1="428" y1="279" x2="470" y2="310" stroke="#ffc53d" stroke-width="3.5"/>
              <polygon points="470,310 440,302 444,328" fill="#ffc53d"/>
              <circle cx="470" cy="310" r="10" fill="#3ecf8e"/>
              <circle cx="428" cy="279" r="7" fill="#ffc53d"/>
              <circle cx="610" cy="198" r="7" fill="#ffc53d"/>
              <text x="484" y="336" fill="#3ecf8e" font-size="22">x* = (1, 0)</text>
              <text x="330" y="300" fill="#ffc53d" font-size="21">x⁽²⁾</text>
              <text x="622" y="192" fill="#ffc53d" font-size="21">x⁽¹⁾</text>
            </svg>
            <div class="mathbox7" style="margin-top:14px"><span class="lbl">第二步方向 d⁽²⁾ 与 d⁽¹⁾ 共轭：</span><br/>d⁽¹ᵀAd⁽²⁾ = 4(−4)(4/17) + 2(−2)(−16/17) = (−64 + 64)/17 = <span class="hi">0 ✓</span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 6 ============ -->
    <div class="scene7" id="d6">
      <div class="grid7">
        <div class="left7">
          <div class="panel7">
            <div class="panel-title7 mono">答案与速记</div>
            <div class="ans-big7"><span class="lbl">x* =</span> (1, 0)</div>
            <div class="ans-big7"><span class="lbl">f* =</span> 0</div>
            <div class="mathbox7" style="margin-top:16px">
