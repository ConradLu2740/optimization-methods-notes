    <!-- ============ SCENE 1 ============ -->
    <div class="scene5" id="f1">
      <div class="wrap">
        <div class="kicker mono">TH 2.11 · 择一定理 · 图是得分主体</div>
        <h1>Farkas 定理<span class="hl">画图</span></h1>
        <div class="sub">一个向量要么落在锥里，要么就被一条过原点的直线分开</div>
        <div class="badges">

          <span class="badge hot">必考第 1 条</span>
          <span class="badge">老师原话：画图</span>
        </div>
        <div class="formula mono">S = cone A = {Aᵀy : y ≥ 0} ｜ c ∈ S 与 c ∉ S 二择一</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scene5" id="f2">
      <div class="grid5">
        <div class="left5">
          <div class="formcard pick">
            <div class="fh">形式 A（PPT 定理 2.11 原版，首选写这个）</div>
            <div class="fl">设 A 为 m×n 矩阵，c 为 n 维向量，则<br/><span class="mono">Ax ≤ 0，cᵀx &gt; 0 有解 ⟺ Aᵀy = c，y ≥ 0 无解</span></div>
          </div>
          <div class="formcard">
            <div class="fh">形式 B（二择一，LP 经典版）</div>
            <div class="fl">以下两个论断<b>有且只有一个</b>成立：<br/>① ∃x：Ax = b，x ≥ 0；② ∃y：Aᵀy ≥ 0，bᵀy &lt; 0</div>
          </div>
          <div class="formcard">
            <div class="fh">形式 C（置换定理，画图最好用）</div>
            <div class="fl"><span class="mono">c 是 A 的行向量的凸锥组合（c ∈ cone A）⟺ 对任意 Ax ≤ 0 的 x，都有 cᵀx ≤ 0</span></div>
          </div>
        </div>
        <div class="right5">
          <div class="panel5">
            <div class="panel-title5 mono">考场写法建议</div>
            <div class="step5"><span class="sn">1</span><div class="st">先写<b>形式 A</b>（PPT 原版），紧接一句"等价地（置换定理）c ∈ cone A 当且仅当……"</div></div>
            <div class="step5"><span class="sn">2</span><div class="st">然后<b>画图</b>：凸锥 + 分离超平面（下面两幕）</div></div>
            <div class="step5"><span class="sn">3</span><div class="st">最后写一句<b>意义</b>：线性系统"有解 / 无解"可以用几何分离来判定</div></div>
            <div class="verdict5 in" style="margin-top:20px">三种形式是同一个定理的换写：B 把 ≤ 写成 =、非负约束挪到 x 上；C 是"锥"语言，最适合画图。</div>
          </div>
          <div class="panel5" style="margin-top:22px">
            <div class="panel-title5 mono">图里有什么</div>
            <div style="font-size:26px;line-height:1.65;color:#e9eef8">记 <b style="color:#ffc53d;font-weight:400">S = cone A</b> = A 的行向量 a₁,…,a_m 经<b style="color:#ffc53d;font-weight:400">非负组合</b>张成的凸锥。二维平面里就是两条射线夹成的角形，顶点在原点。<br/>c 与 S 的关系<b style="color:#ffc53d;font-weight:400">二择一</b>：要么 c 在锥内，要么 c 在锥外。</div>
          </div>
        </div>
      </div>
    </div>

              <text id="y1lab" x="446" y="288" fill="#3ecf8e" font-size="21">y1 = 1</text>

        <div class="right5">

            <div class="step5"><span class="sn">·</span><div class="st">任何满足 <span class="mono">Ax ≤ 0</span> 的方向 x 都与 c 成<b>钝角或直角</b>（<span class="mono">cᵀx ≤ 0</span>）</div></div>
            <div class="step5"><span class="sn">·</span><div class="st">所以<b>不存在</b> <span class="mono">cᵀx &gt; 0</span> 的方向 ⇒ 系统 I 无解</div></div>
            <div class="verdict5 in" style="margin-top:20px">图里看到：c 落在黄色锥内，由两条射线的非负组合（本例 y₁ = y₂ = 1）拼成。</div>
          </div>

          </div>
        </div>

              <line x1="380" y1="310" x2="677" y2="230" stroke="#5aa9ff" stroke-width="3.5"/>
              <line x1="380" y1="310" x2="498" y2="56" stroke="#5aa9ff" stroke-width="3.5"/>

            <div class="step5"><span class="sn">·</span><div class="st">存在过原点的分离超平面 <span class="mono">H: xᵀz = 0</span>，法向量 x 满足<br/><span class="mono">aᵢᵀx ≤ 0（即 Ax ≤ 0）且 cᵀx &gt; 0</span></div></div>

          </div>

            <div class="step5"><span class="sn">2</span><div class="st">画<b>左右两个小图</b>：左图 c 在锥内；右图 c 在锥外</div></div>
            <div class="step5"><span class="sn">3</span><div class="st">右图补一条<b>过 O 的虚线 H</b>（分离超平面）+ 法向量箭头 x，标上 <span class="mono">a₁ᵀx ≤ 0、a₂ᵀx ≤ 0、cᵀx &gt; 0</span></div></div>
            <div class="step5"><span class="sn">4</span><div class="st">每个小图旁边<b>写一句结论</b>（照抄：锥内 ⇒ Aᵀy=c,y≥0 有解；锥外 ⇒ Ax≤0,cᵀx&gt;0 有解）</div></div>
            <div class="verdict5 in" style="margin-top:20px">一句话意义：线性系统"有解 / 无解"可以用<b>几何分离</b>来判定——这就是择一定理的名字来源。</div>
          </div>
        </div>
        <div class="right5">

            <div class="panel-title5 mono">二择一速记</div>

            </div>
            <div class="formcard">
              <div class="fh">c ∉ S</div>
              <div class="fl">⇒ 存在 x 使 Ax ≤ 0 且 cᵀx &gt; 0 ⇒ 系统 I 有解 ⇒ 有下降方向</div>
            </div>
            <div class="formcard pick">
              <div class="fh">和其他考点的联系</div>
              <div class="fl">Zoutendijk 的"方向 LP 最优值为 0 ⟺ KKT"（Th12.1.2）证明用的就是 <b>Farkas 定理</b>；凸集严格分离定理（Th2.7）是它的几何底子。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
