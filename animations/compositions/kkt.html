    <!-- ============ SCENE 1 ============ -->
    <div class="scene4" id="k1">
      <div class="wrap">
        <div class="kicker mono">CH7 · KKT + SECOND-ORDER CONDITIONS · 约束最优性</div>
        <h1>KKT 与<span class="hl">二阶充分条件</span></h1>
        <div class="sub">过了一阶 KKT，只拿到"嫌疑人名单"；二阶才定罪</div>
        <div class="badges">
          <span class="badge">约束极值</span>
          <span class="badge hot">必考</span>
          <span class="badge">四问标准题型</span>
        </div>
        <div class="formula mono">L = f − Σuᵢgᵢ − Σvⱼhⱼ ｜ ∇²ₓₓL = ∇²f − Σuᵢ∇²gᵢ − Σvⱼ∇²hⱼ（减号）</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scene4" id="k2">
      <div class="grid4">
        <div class="left4">
          <div class="panel4">
            <div class="panel-title4 mono">题目（11-17 练题，两 KKT 点 + 二阶判别）</div>
            <div class="mathbox">
              <div><span class="lbl">min</span> f = (x1+1)² + x2²</div>
              <div><span class="lbl">s.t.</span> g = x1² + x2² − 1 ≥ 0</div>
            </div>
            <div class="panel-title4 mono">KKT 四条件（L = f − u·g，g ≥ 0 口径）</div>
            <div class="cond4"><span class="cn">1</span><div class="ct">稳定性：<span class="mono">∇f − u∇g = 0</span></div></div>
            <div class="cond4"><span class="cn">2</span><div class="ct">可行：<span class="mono">g(x) ≥ 0</span>，<span class="mono">u ≥ 0</span></div></div>
            <div class="cond4"><span class="cn">3</span><div class="ct">互补松弛：<span class="mono">u·g(x) = 0</span></div></div>
            <div class="cond4"><span class="cn">4</span><div class="ct">正则点（本题梯度线性无关，自动满足）</div></div>
          </div>
        </div>
        <div class="right4">
          <div class="panel4">
            <div class="panel-title4 mono">解 KKT 方程组（分两支）</div>
            <div class="mathbox">
              <div><span class="lbl">由 ∇f − u∇g = 0：</span></div>
              <div>2(x1+1) − 2u·x1 = 0　⇒　x1 + 1 = u·x1</div>
              <div>2x2 − 2u·x2 = 0　⇒　x2·(1 − u) = 0</div>
            </div>
            <div class="ptcard"><div class="ph">支 1：u = 0</div><div class="pl">⇒ x1 = −1，x2 = 0；g(−1,0) = 0 ✓ 可行<br/>得 <b>KKT 点① (−1, 0)，u = 0</b>（g 取等但乘子为 0：<b>弱起作用</b>）</div></div>
            <div class="ptcard"><div class="ph">支 2：x2 = 0</div><div class="pl">⇒ u = 1 + 1/x1；由互补松弛 g = 0 ⇒ x1 = ±1<br/>x1 = −1 时 u = 0 矛盾；<b>x1 = 1 时 u = 2 ✓</b><br/>得 <b>KKT 点② (1, 0)，u = 2</b></div></div>
          </div>
        </div>
      </div>
    </div>

              </g>
            </svg>

        <div class="right4">
          <div class="panel4">
            <div class="panel-title4 mono">图里读信息</div>
            <div class="cond4"><span class="cn">·</span><div class="ct">可行域 = 圆<b>外</b>部（含边界），目标值 = 到 (−1,0) 距离的平方</div></div>
            <div class="cond4"><span class="cn">·</span><div class="ct">(−1,0) 在可行域内部，f = 0 是<b>全局最小</b>的强候选</div></div>
            <div class="cond4"><span class="cn">·</span><div class="ct">(1,0) 在边界上，u = 2 ≠ 0 ⇒ <b>约束真正起作用</b>，要过二阶</div></div>

          </div>
