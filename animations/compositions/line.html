    <!-- ============ SCENE 1 ============ -->
    <div class="scene9" id="l1">
      <div class="wrap">
        <div class="kicker mono">CH9 · 试探法 · 不需要导数</div>
        <h1>一维搜索：<span class="hl">0.618</span> 与 Fibonacci</h1>
        <div class="sub">每轮只在区间里放两个点，比一比，丢一段——旧点还能再利用</div>
        <div class="badges">
          <span class="badge">单峰函数</span>
          <span class="badge">旧点复用</span>
          <span class="badge hot">计算题常考</span>
        </div>
        <div class="formula mono">0.618：λ = a + 0.382(b−a)，μ = a + 0.618(b−a) ｜ Fibonacci：λₖ = aₖ + F₍ₙ₋ₖ₋₁₎/F₍ₙ₋ₖ₊₁₎(bₖ−aₖ)</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scene9" id="l2">
      <div class="grid9">
        <div class="left9">
          <div class="panel9">
            <div class="panel-title9 mono">一维搜索在优化里的位置</div>
            <div class="mathbox9">
              <div><span class="lbl">给定方向 d，把多维问题降成一维：</span></div>
              <div>φ(λ) = f(x + λd)　⇒　min φ(λ)</div>
            </div>
            <div class="step9"><span class="sn">1</span><div class="st"><b>单峰假设</b>：区间 [a, b] 里只有一个谷。于是"哪边函数值大，谷就在另一边"</div></div>
            <div class="step9"><span class="sn">2</span><div class="st"><b>放两个点</b> λ &lt; μ，算 φ(λ)、φ(μ)</div></div>
            <div class="step9"><span class="sn">3</span><div class="st"><b>丢一段</b>：φ(λ) &lt; φ(μ) ⇒ 谷在左边 ⇒ 丢 [μ, b]；否则丢 [a, λ]</div></div>
            <div class="step9"><span class="sn">4</span><div class="st"><b>旧点复用</b>：留下的那个点正好是新区间的一个内点 ⇒ <b>每轮只算 1 个新点</b></div></div>
            <div class="verdict9 ok">不用导数、不用知道函数解析式，只要能在给定点算出函数值——这就是"试探法"。</div>
          </div>
        </div>
        <div class="right9">
          <div class="panel9">
            <div class="panel-title9 mono">本例函数（谷在 λ = 2）</div>
            <div class="mathbox9"><span class="lbl">φ(λ) =</span> (λ − 2)² + 1　<span class="lbl">区间</span> [a, b] = [0, 5]</div>
            <svg width="600" height="440" viewBox="0 0 900 520">

              <text x="52" y="56" fill="#8fa3c8" font-size="22">φ</text>
              <polyline id="lcurve" points="80,280 160,346 240,394 320,422 400,432 480,422 560,394 640,346 720,280 800,194 880,90"

              <text x="412" y="452" fill="#3ecf8e" font-size="21">谷 λ* = 2</text>
              <text x="160" y="270" fill="#8fa3c8" font-size="20">φ(0)=5</text>
              <text x="820" y="80" fill="#8fa3c8" font-size="20">φ(5)=10</text>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 3 ============ -->
    <div class="scene9" id="l3">
      <div class="grid9">
        <div class="left9">
          <div class="panel9">
            <div class="panel-title9 mono">第一轮：放点 → 比较 → 丢右段</div>
            <svg width="1020" height="520" viewBox="0 0 900 520">
              <line x1="80" y1="470" x2="880" y2="470" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="80" y1="470" x2="80" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <polyline points="80,280 160,346 240,394 320,422 400,432 480,422 560,394 640,346 720,280 800,194 880,90"
                fill="none" stroke="#8fa3c8" stroke-width="2.5"/>
              <rect id="kill1" x="560" y="40" width="320" height="430" fill="rgba(255,107,107,0.12)" opacity="0"/>
              <line id="lam1" x1="385" y1="470" x2="385" y2="330" stroke="#ffc53d" stroke-width="3" stroke-dasharray="8 6"/>
              <line id="mu1" x1="695" y1="470" x2="695" y2="330" stroke="#5aa9ff" stroke-width="3" stroke-dasharray="8 6"/>
              <circle id="pl1" cx="385" cy="330" r="8" fill="#ffc53d"/>
              <circle id="pm1" cx="695" cy="330" r="8" fill="#5aa9ff"/>
              <text id="lam1l" x="330" y="316" fill="#ffc53d" font-size="22">λ₁ = 1.910</text>
              <text id="mu1l" x="700" y="316" fill="#5aa9ff" font-size="22">μ₁ = 3.090</text>
              <text id="fl1" x="300" y="368" fill="#ffc53d" font-size="20">φ = 1.008</text>
              <text id="fm1" x="710" y="368" fill="#5aa9ff" font-size="20">φ = 2.188</text>
              <text id="kill1l" x="600" y="60" fill="#ff9b9b" font-size="22" opacity="0">丢 [μ, b]</text>
              <text id="keep1l" x="120" y="60" fill="#3ecf8e" font-size="22" opacity="0">保留 [a, μ] = [0, 3.090]</text>
              <line id="b1" x1="80" y1="60" x2="80" y2="470" stroke="#8fa3c8" stroke-width="2"/>
              <text id="a1l" x="66" y="60" fill="#8fa3c8" font-size="20">a=0</text>
              <text id="b1l" x="866" y="60" fill="#8fa3c8" font-size="20" text-anchor="end">b=5</text>
            </svg>
          </div>
        </div>
        <div class="right9">
          <div class="panel9">
            <div class="panel-title9 mono">0.618 法的取点</div>
            <div class="mathbox9">
              <div><span class="lbl">λ₁ = a + 0.382(b−a)</span> = 0 + 0.382×5 = <span class="hi">1.910</span></div>
              <div><span class="lbl">μ₁ = a + 0.618(b−a)</span> = 0 + 0.618×5 = <span class="hi">3.090</span></div>
            </div>
            <div class="step9"><span class="sn">·</span><div class="st">φ(λ₁) = 1.008 <b>&lt;</b> φ(μ₁) = 2.188 ⇒ 谷在左边 ⇒ <b>丢 [μ₁, b]</b></div></div>
            <div class="step9"><span class="sn">·</span><div class="st">新区间 [0, 3.090]；<b>λ₁ = 1.910 变成新 μ₂</b>（旧点复用！）</div></div>
            <div class="step9"><span class="sn">·</span><div class="st">所以第二轮只算 <b>1 个</b>新点 λ₂ = 0 + 0.382×3.090 = 1.180</div></div>
            <div class="verdict9 warn">0.382 + 0.618 = 1，两点把区间按黄金比分割——这也是"0.618 法"名字的来历。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 4 ============ -->
    <div class="scene9" id="l4">
      <div class="grid9">
        <div class="left9">
          <div class="panel9">
            <div class="panel-title9 mono">0.618 迭代表（φ(λ) = (λ−2)² + 1，[0, 5]）</div>
            <table class="tbl9">
              <tr><th>轮</th><th>a</th><th>b</th><th>λₖ</th><th>μₖ</th><th>φ(λₖ)</th><th>φ(μₖ)</th><th>保留区间</th></tr>
              <tr><td class="k">1</td><td>0.000</td><td>5.000</td><td>1.910</td><td>3.090</td><td>1.008</td><td>2.188</td><td class="reuse">[0, 3.090]</td></tr>
              <tr><td class="k">2</td><td>0.000</td><td>3.090</td><td>1.180</td><td class="reuse">1.910</td><td>1.672</td><td>1.008</td><td class="reuse">[1.180, 3.090]</td></tr>
              <tr><td class="k">3</td><td>1.180</td><td>3.090</td><td class="reuse">1.910</td><td>2.361</td><td>1.008</td><td>1.130</td><td class="reuse">[1.180, 2.361]</td></tr>
              <tr><td class="k">4</td><td>1.180</td><td>2.361</td><td>1.631</td><td class="reuse">1.910</td><td>1.136</td><td>1.008</td><td class="reuse">[1.631, 2.361]</td></tr>
              <tr><td class="k">5</td><td>1.631</td><td>2.361</td><td class="reuse">1.910</td><td>2.082</td><td>1.008</td><td>1.007</td><td class="reuse">[1.910, 2.361]</td></tr>
              <tr><td class="k">6</td><td>1.910</td><td>2.361</td><td>2.082</td><td class="reuse">2.188</td><td>1.007</td><td>1.036</td><td class="reuse">[1.910, 2.188]</td></tr>
            </table>
            <div class="verdict9 ok" style="margin-top:16px">绿色 = 复用上轮的点。区间长度：5 → 3.09 → 1.91 → 1.18 → 0.73 → 0.45 → 0.28（每轮 ×0.618）</div>
          </div>
        </div>
        <div class="right9">
          <div class="panel9">
            <div class="panel-title9 mono">三条必背结论</div>
            <div class="step9"><span class="sn">1</span><div class="st">丢段规则：<span class="mono">φ(λ) &lt; φ(μ) ⇒ 丢右段 [μ, b]</span>；反之丢左段 [a, λ]</div></div>
            <div class="step9"><span class="sn">2</span><div class="st">区间收缩率固定 <span class="mono">0.618</span>：Lₖ₊₁ = 0.618·Lₖ</div></div>
            <div class="step9"><span class="sn">3</span><div class="st">每轮只算 <b>1 个</b>新点（另一个复用），这就是它省函数次数的原因</div></div>
            <div class="verdict9 warn" style="margin-top:16px">易错：λ 和 μ 别写反（λ 小 μ 大）；比较的是<b>函数值</b>不是点的位置；丢段后新区间的端点是"留下的那个点"，不是 a 或 b 原值。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scene9" id="l5">
      <div class="grid9">
        <div class="left9">
          <div class="panel9">
            <div class="panel-title9 mono">Fibonacci 法：按精度 δ 定轮数</div>
            <div class="mathbox9">
              <div><span class="lbl">第一步：定最小 n 使</span> Fₙ ≥ (b₁ − a₁)/δ</div>
              <div><span class="lbl">本例</span> (5 − 0)/1 = 5 ⇒ F₅ = 5 ≥ 5 ⇒ <span class="hi">n = 5</span></div>
            </div>
            <div class="mathbox9">
              <div><span class="lbl">取点（分母是 F₍ₙ₋ₖ₊₁₎，最易错）：</span></div>
              <div>λₖ = aₖ + F₍ₙ₋ₖ₋₁₎/F₍ₙ₋ₖ₊₁₎ · (bₖ − aₖ)</div>
              <div>μₖ = aₖ + F₍ₙ₋ₖ₎/F₍ₙ₋ₖ₊₁₎ · (bₖ − aₖ)</div>
            </div>
            <table class="tbl9">
              <tr><th>k</th><th>区间</th><th>λₖ = F₍ₙ₋ₖ₋₁₎/F₍ₙ₋ₖ₊₁₎</th><th>μₖ = F₍ₙ₋ₖ₎/F₍ₙ₋ₖ₊₁₎</th></tr>
              <tr><td class="k">1</td><td>[0, 5]</td><td>F₃/F₅ = 2/5 ⇒ 2.000</td><td>F₄/F₅ = 3/5 ⇒ 3.000</td></tr>
              <tr><td class="k">2</td><td>[0, 3]</td><td>F₂/F₄ = 1/3 ⇒ 1.000</td><td class="reuse">2.000（复用）</td></tr>
              <tr><td class="k">3</td><td>[1, 3]</td><td class="reuse">2.000（复用）</td><td>F₂/F₃ = 1/2 ⇒ 2.000</td></tr>
            </table>
            <div class="verdict9 ok" style="margin-top:14px">最终区间长度 = L·F₁/Fₙ = 5×(1/5) = <b>1 = δ</b>，正好达到要求的精度。</div>
          </div>
        </div>
        <div class="right9">
          <div class="panel9">
            <div class="panel-title9 mono">和 0.618 什么关系</div>
            <div class="step9"><span class="sn">·</span><div class="st">Fibonacci 按<b>给定轮数 n</b> 最优安排取点，收缩比逐轮变化（Fₙ₋ₖ/Fₙ₋ₖ₊₁）</div></div>
            <div class="step9"><span class="sn">·</span><div class="st">0.618 法是它的<b>极限版</b>：n 很大时 Fₙ₋₁/Fₙ → 0.618，收缩率变成常数</div></div>
            <div class="step9"><span class="sn">·</span><div class="st">工程上几乎都用 0.618（不用先定 n）；考试两种都要会列</div></div>
            <div class="verdict9 warn" style="margin-top:16px">⚠️ 笔记里把分母写成 F₍ₙ₊₁₎ 是错的，正确是 <b>F₍ₙ₋ₖ₊₁₎</b>（11-08 已修正）。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 6 ============ -->
    <div class="scene9" id="l6">
      <div class="grid9">
        <div class="left9">
          <div class="panel9">
            <div class="panel-title9 mono">另外两种一维搜索（别混）</div>
            <div class="formcard9">
              <div class="fh">一元牛顿法（用导数）</div>
              <div class="fl"><span class="mono">x⁽ᵏ⁺¹⁾ = x⁽ᵏ⁾ − φ′(x⁽ᵏ⁾)/φ″(x⁽ᵏ⁾)</span><br/>要求一阶二阶导数；<b>≥ 2 阶收敛</b>，比试探法快得多，但可能跑出单峰区间</div>
            </div>
            <div class="formcard9">
              <div class="fh">割线法（不用二阶导）</div>
