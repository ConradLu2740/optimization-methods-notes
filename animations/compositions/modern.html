    </style>
    <div id="bgmt"><div class="grid"></div><div id="glowmt"></div><div id="glowmtb"></div></div>
    <div id="chrome-topmt">
      <div id="series-labelmt" class="mono">最优化方法与应用 · 知识点动画 15</div>
      <div id="topic-badgemt">开放题 · 现代优化算法 vs 传统优化算法</div>
    </div>
    <!-- ============ SCENE 1 ============ -->
    <div class="scenemt" id="s1mt">
      <div class="wrap">
        <div class="kicker mono">开放题 · 10 分 · 课堂笔记原题</div>
        <h1>现代 vs <span class="hl">传统</span>优化算法</h1>
        <div class="sub">同一副骨架，两种活法</div>
        <div class="badges">
          <span class="badge">开放题 10 分</span>
          <span class="badge">差别 5 + 联系 4</span>
          <span class="badge hot">背模板就能拿分</span>
        </div>
        <div class="formula mono">共同骨架：xₖ₊₁ = xₖ + λₖdᵏ ｜ 目标一致：求 min f(x)</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scenemt" id="s2mt">
      <div class="gridmt">
        <div class="leftmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">先写"同源"：所有迭代优化算法共用一副骨架</div>
            <div class="mathboxmt">
              <div><span class="lbl">xₖ₊₁ =</span> xₖ + λₖ·dᵏ</div>
              <div><span class="lbl">两大组件：方向 dᵏ + 步长 λₖ</span></div>
            </div>
            <div class="stepmt"><span class="sn">·</span><div class="st"><b>传统</b>：d = −∇f 或 −H⁻¹∇f（靠<b>导数信息</b>定向）</div></div>
            <div class="stepmt"><span class="sn">·</span><div class="st"><b>现代</b>：d 来自种群/邻域/随机采样（GA 的交叉变异、SA 的随机跳、蚁群的信息素）</div></div>
            <div class="stepmt"><span class="sn">·</span><div class="st">两者都在回答同一个问题：<b>从当前点往哪走、走多远</b></div></div>
            <div class="verdictmt ok">开场这样写立刻拿框架分："两类算法共享迭代骨架 xₖ₊₁ = xₖ + λₖdᵏ，差别在于方向与步长从哪来、以及收敛性如何保证。"</div>
          </div>
        </div>
        <div class="rightmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">两种问法的答题骨架</div>
            <div class="formcardmt">
              <div class="fh">问法 A：介绍一种现代算法 + 与传统对比</div>
              <div class="fl">算法 80 字 → 流程（编码 → 种群 → 评价 → 选择 → 交叉 → 变异）→ 差别 5 条 → 联系 4 条 → 收尾"牺牲精度与理论保证换 NP-hard 全局能力"</div>
            </div>
            <div class="formcardmt">
              <div class="fh">问法 B：凸算法两种 + 非凸算法两种 + 五行对比表</div>
              <div class="fl">凸：最速下降 / 阻尼牛顿；非凸：GA / SA → 五行对比表 → 相似 4 条 → 全局优化原理（NP-hard ⇒ 满意解）</div>
            </div>
            <div class="verdictmt warn" style="margin-top:16px">口径提醒：说"全局最优"必须补一句<b>"概率意义 / 近似满意解"</b>，不能说成保证找到严格全局最优。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 3 ============ -->
    <div class="scenemt" id="s3mt">
      <div class="gridmt">
        <div class="leftmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">差别 5 条（表格直接抄）</div>
            <table class="tblmt">
              <tr><th>维度</th><th>传统优化算法</th><th>现代优化算法</th></tr>
              <tr><td class="k">解的性质</td><td>局部、确定性</td><td>全局、随机性</td></tr>
              <tr><td class="k">需要的信息</td><td>至少一阶可微（梯度）</td><td>只需函数值</td></tr>
              <tr><td class="k">最优性保证</td><td>有（凸规划下 KKT 即全局）</td><td>无严格保证</td></tr>
              <tr><td class="k">适用问题</td><td>凸、小规模</td><td>非凸、NP-hard、大规模</td></tr>
              <tr><td class="k">代价</td><td>收敛慢但每步便宜</td><td>海量函数评价（计算量大）</td></tr>
            </table>
          </div>
        </div>
        <div class="rightmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">联系 4 条（别只写差别）</div>
            <div class="stepmt"><span class="sn">1</span><div class="st"><b>迭代骨架同源</b>：都是 xₖ₊₁ = xₖ + λₖdᵏ，"方向 + 步长"两大组件</div></div>
            <div class="stepmt"><span class="sn">2</span><div class="st"><b>理论工具共用</b>：凸性、KKT、罚函数（罚函数法本身就是两者的桥）</div></div>
            <div class="stepmt"><span class="sn">3</span><div class="st"><b>可以融合</b>：memetic 算法（GA + 局部搜索）、Multi-Start（多起点 + 传统下降）</div></div>
            <div class="stepmt"><span class="sn">4</span><div class="st"><b>跳出局部的机制同源</b>：随机重启 / 邻域扰动 vs 现代算法的变异 / 退火跳</div></div>
            <div class="verdictmt ok">收尾句："<b>牺牲精度与理论保证，换来处理 NP-hard 全局问题的能力</b>"——这句是给分点。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 4 ============ -->
    <div class="scenemt" id="s4mt">
      <div class="gridmt">
        <div class="leftmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">一张图看懂：两类算法在"确定 ↔ 随机"光谱上的位置</div>
            <svg width="1020" height="440" viewBox="0 0 900 440">
              <line x1="80" y1="220" x2="830" y2="220" stroke="#8fa3c8" stroke-width="2"/>
              <polygon points="830,220 808,210 808,230" fill="#8fa3c8"/>
              <text x="836" y="252" fill="#8fa3c8" font-size="20">随机 / 全局</text>
              <text x="60" y="252" fill="#8fa3c8" font-size="20" text-anchor="start">确定 / 局部</text>
              <g>
                <circle cx="180" cy="220" r="14" fill="#5aa9ff"/>
                <text x="180" y="180" fill="#5aa9ff" font-size="21" text-anchor="middle">最速下降</text>
                <circle cx="280" cy="220" r="14" fill="#5aa9ff"/>
                <text x="280" y="180" fill="#5aa9ff" font-size="21" text-anchor="middle">牛顿</text>
                <circle cx="380" cy="220" r="14" fill="#5aa9ff"/>
                <text x="380" y="180" fill="#5aa9ff" font-size="21" text-anchor="middle">共轭梯度</text>
                <circle cx="480" cy="220" r="14" fill="#5aa9ff"/>
                <text x="480" y="180" fill="#5aa9ff" font-size="21" text-anchor="middle">拟牛顿</text>
                <circle cx="560" cy="220" r="14" fill="#ffc53d"/>
                <text x="560" y="180" fill="#ffc53d" font-size="21" text-anchor="middle">罚函数 / 可行方向</text>
                <circle cx="660" cy="220" r="14" fill="#3ecf8e"/>
                <text x="660" y="180" fill="#3ecf8e" font-size="21" text-anchor="middle">模拟退火</text>
                <circle cx="740" cy="220" r="14" fill="#3ecf8e"/>
                <text x="740" y="180" fill="#3ecf8e" font-size="21" text-anchor="middle">遗传算法</text>
              </g>
              <text x="450" y="300" fill="#8fa3c8" font-size="21" text-anchor="middle">蓝色 = 传统（导数驱动）｜ 黄色 = 桥梁（罚函数把约束变无约束）｜ 绿色 = 现代（随机驱动）</text>
              <text x="450" y="336" fill="#8fa3c8" font-size="21" text-anchor="middle">越往右：越不需要导数、越能碰非凸、越没有理论保证</text>
            </svg>
          </div>
        </div>
        <div class="rightmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">课堂笔记的原始考点</div>
            <div class="stepmt"><span class="sn">·</span><div class="st">CH1-2 讲义：Global Optimization、NP-hard、确定性 GO（Covering / 广义下降 / 学习 / B&amp;B）</div></div>
            <div class="stepmt"><span class="sn">·</span><div class="st">随机性 GO：Multi-Start / Tabu / 蚁群 / Bayesian / 聚类 / SA / GA / DE</div></div>
            <div class="stepmt"><span class="sn">·</span><div class="st">考点清单第 9 条"智能优化的概念了解一下" ⇒ 考的是<b>概念对比</b>，不是算法细节</div></div>
            <div class="verdictmt warn">别在卷面上推 GA 的选择/交叉算子——10 分题考的是<b>对比框架</b>，写流程 6 步 + 差别 5 + 联系 4 就够。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scenemt" id="s5mt">
      <div class="gridmt">
        <div class="leftmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">全局优化原理（收尾必写）</div>
            <div class="mathboxmt">
              <div><span class="lbl">NP-hard：</span>不存在多项式时间算法保证找到严格全局最优</div>
              <div><span class="lbl">推论：</span>"既不可能、也不现实"⇒ 退而求<b>近似满意解</b></div>
            </div>
            <div class="stepmt"><span class="sn">1</span><div class="st">现代算法用<b>随机搜索 + 种群</b>换"跳出去"的能力</div></div>
            <div class="stepmt"><span class="sn">2</span><div class="st">收敛性只能说成"<b>概率意义下收敛 / 以概率 1 收敛</b>"</div></div>
            <div class="stepmt"><span class="sn">3</span><div class="st">评价标准从"找到最优"变成"<b>在可接受代价内找到足够好的解</b>"</div></div>
            <div class="verdictmt ok">三句话版本：NP-hard 决定严格全局最优不现实 ⇒ 用随机性换全局能力 ⇒ 以概率意义和近似解为验收标准。</div>
          </div>
        </div>
        <div class="rightmt">
          <div class="panelmt">
            <div class="panel-titlemt mono">考前 5 句自查</div>
            <div class="stepmt"><span class="sn">1</span><div class="st">骨架句写了吗：<span class="mono">xₖ₊₁ = xₖ + λₖdᵏ</span>，方向 + 步长？</div></div>
            <div class="stepmt"><span class="sn">2</span><div class="st">差别 5 条齐了吗（局部/确定 vs 全局/随机、可微 vs 函数值、保证有无、问题规模、代价）？</div></div>
            <div class="stepmt"><span class="sn">3</span><div class="st">联系 4 条齐了吗（骨架、理论工具、可融合、跳出局部机制）？</div></div>
            <div class="stepmt"><span class="sn">4</span><div class="st">"全局最优"后面补了"<b>概率意义 / 近似</b>"吗？</div></div>
            <div class="stepmt"><span class="sn">5</span><div class="st">收尾句"牺牲精度与理论保证换 NP-hard 全局能力"写了吗？</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};

      { t: 6.45,  label: "2 / 5 · 同源骨架",   text: "两大组件：方向 + 步长；传统靠导数，现代靠随机" },
      { t: 17.45, label: "3 / 5 · 差别与联系", text: "差别 5 条 + 联系 4 条，一张表抄完" },
      { t: 29.45, label: "4 / 5 · 光谱定位",   text: "确定 → 随机光谱：蓝传统、黄桥梁、绿现代" },
      { t: 40.45, label: "5 / 5 · 原理与自查", text: "NP-hard ⇒ 满意解；概率意义 / 近似；考前 5 句" },

    steps.forEach((s) => {
      tl.set("#step-labelmt", { textContent: s.label }, s.t);
      tl.set("#captionmt", { innerHTML: s.text }, s.t);
      tl.fromTo("#captionmt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, s.t + 0.05);
    });
    tl.fromTo("#progmt", { scaleX: 0 }, { scaleX: 1, duration: D, ease: "none" }, 0);
    tl.from("#s1mt .kicker", { y: 24, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.3);
    tl.from("#s1mt h1", { y: 74, opacity: 0, scale: 0.94, duration: 0.75, ease: "power3.out" }, 0.5);
    tl.from("#s1mt .sub", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.0);
    tl.from("#s1mt .badge", { y: 26, opacity: 0, scale: 0.9, duration: 0.45, ease: "back.out(1.7)", stagger: 0.13 }, 1.35);
