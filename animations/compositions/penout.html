    <!-- ============ SCENE 1 ============ -->
    <div class="scenepe" id="s1pe">
      <div class="wrap">
        <div class="kicker mono">CH13.1 · 惩罚函数法 · 从可行域外面逼近</div>
        <h1>外点罚<span class="hl">函数法</span></h1>
        <div class="sub">把约束变成一笔"罚款"加进目标，罚到没人敢违反</div>
        <div class="badges">
          <span class="badge">等式 + 不等式都行</span>
          <span class="badge">罚因子 μ ↑ ∞</span>
          <span class="badge hot">四问标准题型</span>
        </div>
        <div class="formula mono">F(x, μ) = f(x) + μP(x) ｜ 等式罚 Σhⱼ² ｜ 不等式罚 Σ(max{0, −gᵢ})² ｜ 判据 μP(x⁽ᵏ⁾) < ε</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scenepe" id="s2pe">
      <div class="gridpe">
        <div class="leftpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">思想：化约束为无约束</div>
            <div class="mathboxpe">
              <div><span class="lbl">原问题</span>　min f(x)　s.t.　g(x) ≥ 0, h(x) = 0</div>
              <div><span class="lbl">辅助问题</span>　min F(x, μ) = f(x) + μ·P(x)</div>
            </div>
            <div class="mathboxpe">
              <div><span class="lbl">等式罚：</span>P₁ = Σ hⱼ(x)²</div>
              <div><span class="lbl">不等式罚：</span>P₂ = Σ (max{0, −gᵢ(x)})²</div>
            </div>
            <div class="panel-titlepe mono">经济解释（讲义原话）</div>
            <div class="steppe"><span class="sn">·</span><div class="st">总代价 = <b>价格 + 罚款</b>：f 是你要付的"价格"，违反约束就按 μ 的比例交罚款</div></div>
            <div class="steppe"><span class="sn">·</span><div class="st">可行点上 P = 0，只付价格；<b>越不可行罚得越狠</b>（平方增长）</div></div>
            <div class="verdictpe ok">μ 取递增正数列 {μₖ}，μₖ → ∞：辅助问题的最优解序列从<b>外侧</b>一步步逼向原问题最优解。</div>
          </div>
        </div>
        <div class="rightpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">一维例子：罚款怎么把解"推"过去</div>
            <svg width="600" height="500" viewBox="0 0 760 520">
              <line x1="80" y1="460" x2="720" y2="460" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="80" y1="460" x2="80" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <text x="716" y="490" fill="#8fa3c8" font-size="22" text-anchor="end">t（沿 x1=x2=t）</text>
              <text x="52" y="56" fill="#8fa3c8" font-size="22">F</text>
              <line id="pefeas" x1="480" y1="460" x2="480" y2="60" stroke="#3ecf8e" stroke-width="2.5" stroke-dasharray="9 7"/>
              <text x="492" y="80" fill="#3ecf8e" font-size="21">t = 1（可行）</text>
              <path id="pec1" d="M 80 360 Q 280 400 480 360 T 680 210" fill="none" stroke="#5aa9ff" stroke-width="3"/>
              <path id="pec2" d="M 80 60 Q 400 380 480 360 T 680 135" fill="none" stroke="#ffc53d" stroke-width="3"/>
              <path id="pec3" d="M 80 20 Q 456 370 480 360 T 680 60" fill="none" stroke="#ff6b6b" stroke-width="3"/>
              <circle id="pem1" cx="280" cy="410" r="8" fill="#5aa9ff"/>
              <circle id="pem2" cx="400" cy="380" r="8" fill="#ffc53d"/>
              <circle id="pem3" cx="456" cy="370" r="8" fill="#ff6b6b"/>
              <text id="pem1l" x="230" y="440" fill="#5aa9ff" font-size="20">μ=0.5 → t=0.5</text>
              <text id="pem2l" x="330" y="352" fill="#ffc53d" font-size="20">μ=2 → t=0.8</text>
              <text id="pem3l" x="470" y="344" fill="#ff6b6b" font-size="20">μ=8 → t=0.94</text>

            <div class="notebelow" style="font-size:25px;line-height:1.6;color:#e9eef8;margin-top:12px">三条曲线是同一个 F 在不同 μ 下的形状：μ 越大，谷越靠近可行点 t=1。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 3 ============ -->
    <div class="scenepe" id="s3pe">
      <div class="gridpe">
        <div class="leftpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">例1（等式约束）：min x₁² + x₂²　s.t.　x₁ + x₂ − 2 = 0</div>
            <div class="mathboxpe">
              <div><span class="lbl">F =</span> x1² + x2² + μ(x1 + x2 − 2)²</div>
              <div><span class="lbl">∂F/∂x₁ = 2x1 + 2μ(x1+x2−2) = 0</span></div>
              <div><span class="lbl">∂F/∂x₂ = 2x2 + 2μ(x1+x2−2) = 0</span></div>
              <div><span class="lbl">两式相减 ⇒ x1 = x2 = t，代回：</span></div>
              <div>t(1 + 2μ) = 2μ ⇒ <span class="hi">t(μ) = 2μ/(2μ+1)</span></div>
            </div>
            <div class="mathboxpe">
              <div><span class="lbl">μ →</span> 1 → 10 → 100 ⇒ t = 2/3 → 20/21 → 200/201</div>
              <div><span class="lbl">极限</span> t → 1 ⇒ <span class="hi">x* = (1, 1)ᵀ</span>，f* = 2</div>
            </div>
            <div class="verdictpe ok">对称性让两式相减就得 x₁ = x₂——等式罚题的常见捷径，比硬解二元方程组快得多。</div>
          </div>
        </div>
        <div class="rightpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">例2（不等式约束）：min x²　s.t.　−x − 1 ≥ 0</div>
            <div class="mathboxpe">
              <div><span class="lbl">F =</span> x² + μ·(max{0, x+1})²</div>
              <div><span class="lbl">x &lt; −1 时</span> F = x²（谷在 x = −1 的左侧边界）</div>
              <div><span class="lbl">x ≥ −1 时</span> F = x² + μ(x+1)²</div>
              <div>F′ = 2x + 2μ(x+1) = 0 ⇒ <span class="hi">x(μ) = −μ/(1+μ)</span></div>
            </div>
            <div class="mathboxpe">
              <div><span class="lbl">μ →</span> 1 → 10 → 100 ⇒ x = −1/2 → −10/11 → −100/101</div>
              <div><span class="lbl">极限</span> x → −1 ⇒ <span class="hi">x* = −1</span>（g = 0 取等）</div>
            </div>
            <div class="verdictpe warn">注意 max{0, −g} 的用法：g = −x−1，违反时 −g = x+1 > 0，所以罚项是 (max{0, x+1})²——<b>先把不等式方向看清楚再写罚项</b>。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 4 ============ -->
    <div class="scenepe" id="s4pe">
      <div class="gridpe">
        <div class="leftpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">算法三歩（SUMT 外点法）</div>
            <div class="steppe"><span class="sn">1</span><div class="st">取 μ₁ &gt; 0，增长因子 c &gt; 1（如 10），令 <span class="mono">μₖ₊₁ = c·μₖ</span></div></div>
            <div class="steppe"><span class="sn">2</span><div class="st">从某个 x⁽ᵏ⁾ 出发，<b>无约束地</b>最小化 F(x, μₖ)，得 x⁽ᵏ⁾</div></div>
            <div class="steppe"><span class="sn">3</span><div class="st"><b>判据</b>：若 <span class="mono">μₖ·P(x⁽ᵏ⁾) < ε</span> 停；否则 k ← k+1 回第 2 步</div></div>
            <div class="panel-titlepe mono" style="margin-top:20px">收敛性（Th13.1.3）</div>
            <div class="mathboxpe"><span class="lbl">水平集 S 紧 + μₖ → ∞ ⇒ 辅助问题最优解的任一聚点都是原问题最优解</span></div>
            <div class="verdictpe ok">引理13.1.1/13.1.2：F 与 f 随 μ 非减、P 非增；f(x*) ≥ F(x⁽ᵏ⁾, μₖ) ≥ f(x⁽ᵏ⁾)——这就是"从外侧逼近"的严格表述。</div>
          </div>
        </div>
        <div class="rightpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">外点 vs 内点（对照记）</div>
            <div class="formcardpe">
              <div class="fh">外点法</div>
              <div class="fl">等式 + 不等式<b>都能用</b>；解序列在可行域<b>外</b>侧；罚因子 <b>μ ↑ ∞</b>；判据 μP &lt; ε</div>
            </div>
            <div class="formcardpe">
              <div class="fh">内点法</div>
              <div class="fl"><b>只解不等式</b>；初点必须严格可行；解序列在<b>内</b>侧；罚因子 <b>μ ↓ 0</b>；判据 μB &lt; ε</div>
            </div>
            <div class="verdictpe warn" style="margin-top:16px">易错：① 罚项是 <b>max{0, −g}</b> 不是 g；② μ 的方向别记反（外↑内↓）；③ 最后必须对 x* <b>验 KKT</b>，别只写"极限即最优"。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scenepe" id="s5pe">
      <div class="gridpe">
        <div class="leftpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">四问标准题型（考场套路）</div>
            <div class="steppe"><span class="sn">1</span><div class="st"><b>构造 F</b>：f + μP，P 按等式/不等式分别写</div></div>
            <div class="steppe"><span class="sn">2</span><div class="st"><b>解驻点方程</b> ∂F/∂x = 0，得闭式 x(μ)；负根/不可行根<b>舍去</b></div></div>
            <div class="steppe"><span class="sn">3</span><div class="st"><b>取极限</b>（外 μ→∞）报 x*、f*</div></div>
            <div class="steppe"><span class="sn">4</span><div class="st"><b>对 x* 验 KKT</b>（乘子 u* = lim μ·…），确认是最优而非仅仅"极限点"</div></div>
            <div class="verdictpe ok">一句话：外点罚函数 = <b>把约束变成罚款，用 μ↑ 把解从外面压回可行域</b>。</div>
          </div>
        </div>
        <div class="rightpe">
          <div class="panelpe">
            <div class="panel-titlepe mono">数字锚点（背这三组）</div>
            <div class="mathboxpe">
              <div><span class="lbl">等式题</span> x1+x2=2：t(μ) = 2μ/(2μ+1) → (1, 1)</div>
              <div><span class="lbl">不等式题</span> −x−1≥0：x(μ) = −μ/(1+μ) → −1</div>
              <div><span class="lbl">罚函数综合题</span> (0,1) 是 KKT 点（u=2）且全局最优</div>
            </div>
            <div class="formcardpe">
              <div class="fh">和 KKT 的联系</div>
              <div class="fl">外点法的 KKT 乘子满足 <span class="mono">uᵢ* = lim μ·(−gᵢ(x(μ)))/gᵢ(x(μ))</span> 型关系；所以做完罚函数题<b>顺手验 KKT</b> 既是检验也是给分点。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
