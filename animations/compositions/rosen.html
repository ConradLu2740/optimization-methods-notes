              <div><span class="lbl">min</span> f = x1² + x2² + 2x2 + 5</div>

              <div>　　　 x1 ≥ 0，x2 ≥ 0</div>
              <div><span class="lbl">初点</span> x⁽¹⁾ = (2, 0)ᵀ　<span class="lbl">∇f =</span> (2x1, 2x2+2)ᵀ</div>

            </div>

    <!-- ============ SCENE 4 ============ -->
    <div class="scenero" id="s4ro">

            </div>

            <div class="stepro"><span class="sn">✓</span><div class="st"><b>可行</b>：沿 x 轴负方向走，x₂ 保持 0（不起约束）；g₁ = 2 − 4λ ≥ 0 在 λ ≤ 1/2 时成立</div></div>

            <div class="formcardro"><div class="fh">4</div><div class="fl">答句："非 KKT 点，可行下降方向 d = …"</div></div>
            <div class="formcardro"><div class="fh">5</div><div class="fl">u 有负分量 ⇒ 删行得 M̂ 再投影（u ≥ 0 ⟺ KKT）</div></div>
          </div>
        </div>
      </div>
