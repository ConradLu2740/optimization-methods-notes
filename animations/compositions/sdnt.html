    <!-- ============ SCENE 1 ============ -->
    <div class="scene8" id="n1">
      <div class="wrap">
        <div class="kicker mono">CH10.1 / 10.2 · 一阶信息 vs 二阶信息</div>
        <h1>最速下降 <span class="hl">vs</span> 牛顿方向</h1>
        <div class="sub">一个沿负梯度慢慢挪，一个用 Hessian 一步到位</div>
        <div class="badges">
          <span class="badge">锯齿现象</span>
          <span class="badge">二阶收敛</span>
          <span class="badge hot">优缺点简答必考</span>
        </div>
        <div class="formula mono">最速下降 d = −∇f/‖∇f‖ ｜ 牛顿 d = −∇²f⁻¹∇f ｜ 阻尼 = 牛顿方向 + 一维搜索</div>
      </div>
    </div>
    <!-- ============ SCENE 2 ============ -->
    <div class="scene8" id="n2">
      <div class="grid8">
        <div class="left8">
          <div class="panel8">
            <div class="panel-title8 mono">例题：病态二次函数（等值线是扁椭圆）</div>
            <div class="mathbox8">
              <div><span class="lbl">min</span> f = x1² + 10x2²　<span class="lbl">A = diag(2, 20)</span></div>
              <div><span class="lbl">初点</span> x⁽¹⁾ = (2, 1)ᵀ　<span class="lbl">最优点</span> (0, 0)ᵀ，f* = 0</div>
            </div>
            <div class="panel-title8 mono">最速下降法（Cauchy 1847）</div>
            <div class="mathbox8"><span class="lbl">d = −∇f(x)/‖∇f(x)‖</span>（单位负梯度）<br/><span class="lbl">步长</span> λₖ = ‖gₖ‖² / (gₖᵀAgₖ)（一维搜索）</div>
            <div class="step8"><span class="sn">·</span><div class="st"><b>锯齿现象</b>：负梯度与等值线不垂直的方向反复横跳，每步都在"纠正"上一步</div></div>
            <div class="step8"><span class="sn">·</span><div class="st"><b>收敛比</b>：((A−a)/(A+a))² = ((20−2)/(20+2))² ≈ <span class="mono">0.67</span>——条件数越大越慢，<b>线性收敛</b></div></div>
            <div class="step8"><span class="sn">·</span><div class="st"><b>优点</b>：只需一阶信息，计算省、存储小；<b>缺点</b>：锯齿、线性收敛</div></div>
          </div>
        </div>
        <div class="right8">
          <div class="panel8">
            <div class="panel-title8 mono">前 6 步的坐标（脚本复算）</div>
            <div class="mathbox8">
              <div><span class="lbl">x⁽⁰⁾ =</span> (2.000, 1.000)　<span class="lbl">f =</span> 14.000</div>
              <div><span class="lbl">x⁽¹⁾ =</span> (1.793, −0.036)　<span class="lbl">λ₁ =</span> 13/251</div>
              <div><span class="lbl">x⁽²⁾ =</span> (0.461, 0.231)　<span class="lbl">λ₂ =</span> 13/35</div>
              <div><span class="lbl">x⁽³⁾ =</span> (0.413, −0.008)　<span class="lbl">λ₃ =</span> 13/251</div>
              <div><span class="lbl">x⁽⁴⁾ =</span> (0.106, 0.053)　<span class="lbl">λ₄ =</span> 13/35</div>
              <div><span class="lbl">x⁽⁵⁾ =</span> (0.095, −0.002)　<span class="lbl">λ₅ =</span> 13/251</div>
            </div>
            <div class="verdict8 warn">λ 在 13/251 和 13/35 之间来回跳——步子一大一小，x₂ 在 0 上下振荡，这就是锯齿。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 3 ============ -->
    <div class="scene8" id="n3">
      <div class="grid8">
        <div class="left8">
          <div class="panel8">
            <div class="panel-title8 mono">几何：锯齿路径（黄色）vs 牛顿一步（绿色）</div>
            <svg width="1020" height="700" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <text x="716" y="338" fill="#8fa3c8" font-size="22" text-anchor="end">x1</text>
              <text x="352" y="52" fill="#8fa3c8" font-size="22">x2</text>
              <g fill="none" stroke="#8fa3c8" stroke-width="1.5" stroke-dasharray="8 7">
                <ellipse cx="380" cy="310" rx="105" ry="33"/>
                <ellipse cx="380" cy="310" rx="235" ry="74"/>
                <ellipse cx="380" cy="310" rx="393" ry="124"/>
              </g>
              <text x="492" y="290" fill="#8fa3c8" font-size="20">f = 1</text>
              <text x="600" y="252" fill="#8fa3c8" font-size="20">f = 5</text>
              <text x="660" y="200" fill="#8fa3c8" font-size="20">f = 14</text>
              <path id="zz" d="M 590 205 L 568 314 L 428 286 L 423 311 L 391 294 L 390 312 L 383 307"
                fill="none" stroke="#ffc53d" stroke-width="3.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <line id="nt" x1="590" y1="205" x2="380" y2="310" stroke="#3ecf8e" stroke-width="3.5" opacity="0"/>
              <circle id="z0" cx="590" cy="205" r="8" fill="#ffc53d"/>
              <text x="600" y="196" fill="#ffc53d" font-size="21">x⁽⁰⁾ = (2, 1)</text>
              <circle id="zend" cx="380" cy="310" r="9" fill="#3ecf8e" opacity="0"/>
              <text id="zendl" x="392" y="336" fill="#3ecf8e" font-size="22" opacity="0">x* = (0, 0)</text>
              <text id="zzl" x="470" y="420" fill="#ffc53d" font-size="21">锯齿：6 步还没到</text>
              <text id="ntl" x="440" y="240" fill="#3ecf8e" font-size="21" opacity="0">牛顿：1 步</text>
            </svg>
          </div>
        </div>
        <div class="right8">
          <div class="panel8">
            <div class="panel-title8 mono">图里读什么</div>
            <div class="step8"><span class="sn">·</span><div class="st">等值线是<b>扁椭圆</b>（x₂ 方向陡、x₁ 方向平），负梯度几乎垂直指向 x₂ 轴</div></div>
            <div class="step8"><span class="sn">·</span><div class="st">于是每步都"冲过"最优点，下一步再"冲回来"——路径呈锯齿</div></div>
            <div class="step8"><span class="sn">·</span><div class="st">6 步后 f 才从 14 降到 <span class="mono">0.002</span>；同样的问题牛顿方向<b>一步</b>到 (0,0)</div></div>
            <div class="verdict8 warn" style="margin-top:16px">条件数 r = A/a = 20/2 = 10 已经算温和；真实问题里 r 到 10⁶ 时最速下降几乎走不动。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 4 ============ -->
    <div class="scene8" id="n4">
      <div class="grid8">
        <div class="left8">
          <div class="panel8">
            <div class="panel-title8 mono">牛顿方向：把曲率也用上</div>
            <div class="mathbox8">
              <div><span class="lbl">d = −∇²f(x)⁻¹ ∇f(x)</span>　<span class="lbl">（Hessian 逆 × 梯度）</span></div>
            </div>
            <div class="panel-title8 mono">同一道题，牛顿方向走一步</div>
            <div class="mathbox8">
              <div><span class="lbl">x⁽¹⁾ =</span> (2, 1)ᵀ　<span class="lbl">g =</span> (4, 20)ᵀ</div>
              <div><span class="lbl">∇²f = A =</span> diag(2, 20)　<span class="lbl">A⁻¹ =</span> diag(1/2, 1/20)</div>
              <div><span class="lbl">d = −A⁻¹g =</span> (−2, −1)ᵀ</div>
              <div><span class="lbl">x⁽¹⁾ + λd，取 λ = 1：</span> (2, 1) + (−2, −1) = <span class="hi">(0, 0)ᵀ = x*</span></div>
            </div>
            <div class="verdict8 ok"><b>严格二次凸函数上，牛顿方向一步到位</b>（λ = 1 时 x + d 就是精确极小点）。<b>二阶收敛</b>速度：误差按平方缩。</div>
            <div class="step8" style="margin-top:16px"><span class="sn">✗</span><div class="st">代价：每步要算 Hessian（n² 个二阶偏导）+ 解一个 n 阶线性方程组（O(n³)）</div></div>
            <div class="step8"><span class="sn">✗</span><div class="st">娇气：Hessian 可能<b>不正定</b>（d 不是下降方向）；只保证<b>局部</b>收敛，初点远了可能跑到别去</div></div>
          </div>
        </div>
        <div class="right8">
          <div class="panel8">
            <div class="panel-title8 mono">几何：一步跨到心上</div>
            <svg width="600" height="520" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <g fill="none" stroke="#8fa3c8" stroke-width="1.5" stroke-dasharray="8 7">
                <ellipse cx="380" cy="310" rx="105" ry="33"/><ellipse cx="380" cy="310" rx="235" ry="74"/>
              </g>
              <path d="M 590 205 L 568 314 L 428 286 L 423 311" fill="none" stroke="#8fa3c8" stroke-width="2.5"/>
              <line id="n4nt" x1="590" y1="205" x2="380" y2="310" stroke="#3ecf8e" stroke-width="4.5"/>
              <polygon points="380,310 412,296 404,324" fill="#3ecf8e"/>
              <circle cx="380" cy="310" r="9" fill="#3ecf8e"/>
              <circle cx="590" cy="205" r="8" fill="#ffc53d"/>
              <text x="392" y="336" fill="#3ecf8e" font-size="22">x* = (0, 0)</text>
              <text x="600" y="196" fill="#ffc53d" font-size="21">x⁽¹⁾ = (2, 1)</text>
              <text x="452" y="240" fill="#3ecf8e" font-size="22">d = (−2, −1)</text>
              <text x="470" y="330" fill="#8fa3c8" font-size="20">灰色 = 最速下降的锯齿</text>
            </svg>
            <div class="mathbox8" style="margin-top:14px"><span class="lbl">对比同一点出发：</span><br/>最速下降：<span class="hi">很多步</span>（线性收敛）<br/>牛顿方向：<span class="hi">1 步</span>（严格二次凸）</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scene8" id="n5">
      <div class="grid8">
        <div class="left8">
          <div class="panel8">
            <div class="panel-title8 mono">两帖药：让牛顿方向既能跑又安全</div>
            <div class="formcard8">
              <div class="fh">药方一：阻尼牛顿法（全局化）</div>
              <div class="fl">d 仍是牛顿方向，但步长不用 1，改用<b>一维搜索</b>：<span class="mono">xₖ₊₁ = xₖ + λₖdᵏ</span>，λₖ 沿该方向找最小。<br/>⇒ 保住二阶收敛的速度，又获得全局下降保证。</div>
            </div>
            <div class="formcard8">
              <div class="fh">药方二：修正牛顿法（保方向）</div>
              <div class="fl">Hessian 非正定时，把它修成正定：<span class="mono">Gₖ = ∇²f(xₖ) + εₖI</span>（εₖ 足够大）<br/>⇒ 保证 d = −Gₖ⁻¹∇f 一定是下降方向。</div>
            </div>
            <div class="verdict8 ok">这两招就是后面拟牛顿 / 共轭梯度的思想源头：<b>保留二阶信息的好处，避开二阶信息的代价</b>。</div>
          </div>
        </div>
        <div class="right8">
          <div class="panel8">
            <div class="panel-title8 mono">什么时候用什么（选型）</div>
            <div class="step8"><span class="sn">·</span><div class="st">n 小、Hessian 好算、初值靠近解 ⇒ <b>牛顿 / 阻尼牛顿</b></div></div>
            <div class="step8"><span class="sn">·</span><div class="st">n 大、只有函数值 / 梯度 ⇒ <b>最速下降</b>（或共轭梯度、拟牛顿）</div></div>
            <div class="step8"><span class="sn">·</span><div class="st">Hessian 不定 / 非凸 ⇒ <b>修正牛顿</b> 或换全局化策略</div></div>
            <div class="verdict8 warn" style="margin-top:16px">一句话：<b>最速下降赢在便宜，牛顿赢在对路</b>。工程上几乎总是"阻尼/修正过的牛顿"或它的近似版。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 6 ============ -->
    <div class="scene8" id="n6">
      <div class="grid8">
        <div class="left8">
          <div class="panel8">
            <div class="panel-title8 mono">优缺点对比（简答直接抄）</div>
            <table class="cmp8">
              <tr><th>维度</th><th>最速下降法</th><th>牛顿方向</th></tr>
              <tr><td class="k">用的信息</td><td>一阶（梯度）</td><td>二阶（梯度 + Hessian）</td></tr>
              <tr><td class="k">每步代价</td><td><span class="mono">O(n)</span>，省</td><td><span class="mono">O(n²)</span> 存 + <span class="mono">O(n³)</span> 解方程，贵</td></tr>
              <tr><td class="k">收敛速度</td><td>线性，收敛比 <span class="mono">((A−a)/(A+a))²</span></td><td><b>二阶</b>；严格二次凸一步到位</td></tr>
              <tr><td class="k">典型毛病</td><td>锯齿、病态时极慢</td><td>Hessian 可能不正定、只局部收敛、娇气</td></tr>
              <tr><td class="k">药方</td><td>共轭梯度 / 拟牛顿</td><td>阻尼（加一维搜索）/ 修正（G = ∇²f + εI）</td></tr>
            </table>
          </div>
        </div>
