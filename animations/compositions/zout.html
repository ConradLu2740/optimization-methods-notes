        <div class="formula mono">min ∇fᵀd　s.t.　A₁d ≥ 0，Ed = 0，−1 ≤ dⱼ ≤ 1 ｜ 最优值 &lt; 0 得方向；= 0 ⇒ KKT</div>

            <div class="mathbox10">
              <div><span class="lbl">min</span> f = x1² + x2² − 2x1 − 4x2 + 6</div>
              <div><span class="lbl">s.t.</span> g1 = −2x1 + x2 + 1 ≥ 0</div>
              <div>　　　 g2 = −x1 − x2 + 2 ≥ 0</div>
              <div>　　　 x1, x2 ≥ 0</div>
              <div><span class="lbl">初点</span> x⁽¹⁾ = (0, 0)ᵀ　<span class="lbl">∇f =</span> (2x1−2, 2x2−4)ᵀ</div>
            </div>
            <div class="panel-title10 mono">几何：可行域是个四边形</div>
            <div class="mathbox10">
              <div><span class="lbl">顶点：</span>(0,0) → (2,0) → (1,1) → (0,2)</div>
              <div><span class="lbl">g1 边界</span> x2 = 2x1 − 1　<span class="lbl">g2 边界</span> x1 + x2 = 2</div>

              <div>g1 = 1 &gt; 0　<span class="lbl">⇒ 不起作用</span></div>

            <div class="step10"><span class="sn">1</span><div class="st">起作用约束的梯度组成 <b>A₁</b>；等号约束组成 <b>E</b></div></div>
            <div class="step10"><span class="sn">2</span><div class="st">本例 <span class="mono">A₁ = [[1, 0], [0, 1]]</span>（就是 x₁≥0、x₂≥0 两条），<span class="mono">E</span> 为空</div></div>
            <div class="step10"><span class="sn">3</span><div class="st"><b>Th12.1.1</b>：d 是可行方向 ⟺ <span class="mono">A₁d ≥ 0 且 Ed = 0</span>——两个不等式一摆，方向被限制在一个锥里</div></div>
            <div class="verdict10 warn">易错：<b>先判起不起作用，再写 A₁</b>。把不起作用的 g1、g2 也塞进 A₁，方向就被无谓地限死了。</div>
          </div>

              <text id="conel" x="600" y="420" fill="#ffc53d" font-size="21" opacity="0">可行方向锥<br/>A₁d ≥ 0</text>

              <text x="700" y="290" fill="#ff6b6b" font-size="20">x1 = 0</text>

          </div>
        </div>
      </div>

    <!-- ============ SCENE 4 ============ -->
    <div class="scene10" id="z4">
      <div class="grid10">
        <div class="left10">
          <div class="panel10">
            <div class="panel-title10 mono">第二步：解方向 LP（把"最该往哪走"变成线性规划）</div>
            <div class="mathbox10">
              <div><span class="lbl">min</span> ∇fᵀd = −2d1 − 4d2</div>
              <div><span class="lbl">s.t.</span> A₁d ≥ 0　⇒　d1 ≥ 0，d2 ≥ 0</div>
              <div>　　　Ed = 0　<span class="lbl">（本例无）</span></div>
              <div>　　　−1 ≤ dⱼ ≤ 1　<span class="lbl">（防止方向无界）</span></div>
            </div>
            <div class="mathbox10">
              <div><span class="lbl">要最小化 −2d1 − 4d2，就把 d1、d2 都推到上界 1：</span></div>
              <div>d* = <span class="hi">(1, 1)ᵀ</span>　<span class="lbl">最优值 =</span> −6</div>
            </div>
            <div class="step10"><span class="sn">✓</span><div class="st">检验下降：<span class="mono">∇f(x⁽¹⁾)ᵀd = (−2, −4)·(1, 1) = −6 &lt; 0 ✓</span> 是下降方向</div></div>
            <div class="step10"><span class="sn">✓</span><div class="st">检验可行：沿 d 走一小步仍在可行域内（A₁d = (1,1) ≥ 0）</div></div>
            <div class="verdict10 ok"><b>Th12.1.2</b>：这个 LP 的最优值为 0 ⟺ 当前点是 KKT 点（证明用 <b>Farkas 定理</b>）。最优值 &lt; 0 ⇒ 还得走。</div>
          </div>
        </div>
        <div class="right10">
          <div class="panel10">
            <div class="panel-title10 mono">几何：方向 (1,1) 与 −∇f 的区别</div>
            <svg width="600" height="520" viewBox="0 0 760 620">
              <line x1="40" y1="310" x2="720" y2="310" stroke="#8fa3c8" stroke-width="1.5"/>
              <line x1="380" y1="580" x2="380" y2="40" stroke="#8fa3c8" stroke-width="1.5"/>
              <polygon points="380,310 620,310 500,190 380,70" fill="rgba(62,207,142,0.10)" stroke="#3ecf8e" stroke-width="2"/>
              <line x1="380" y1="310" x2="260" y2="430" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="9 7"/>
              <polygon points="260,430 288,412 276,392" fill="#ff6b6b"/>
              <text x="196" y="456" fill="#ff6b6b" font-size="21">−∇f = (2, 4)</text>
              <line x1="380" y1="310" x2="560" y2="160" stroke="#ffc53d" stroke-width="4.5"/>
              <polygon points="560,160 526,180 542,200" fill="#ffc53d"/>
              <text x="566" y="150" fill="#ffc53d" font-size="24">d = (1, 1)ᵀ</text>
              <circle cx="380" cy="310" r="9" fill="#e9eef8"/>
              <text x="392" y="336" fill="#e9eef8" font-size="21">x⁽¹⁾</text>
              <text x="430" y="240" fill="#8fa3c8" font-size="20">−∇f 指向域外，不能用</text>
              <text x="430" y="266" fill="#8fa3c8" font-size="20">d 是它在可行锥里的投影</text>
            </svg>
            <div class="notebelow" style="font-size:25px;line-height:1.6;color:#e9eef8;margin-top:12px">直接走 −∇f 会立刻出域（红虚线）；方向 LP 自动把方向"掰"回可行锥里。</div>
          </div>
        </div>
      </div>
    </div>
    <!-- ============ SCENE 5 ============ -->
    <div class="scene10" id="z5">
      <div class="grid10">
        <div class="left10">
          <div class="panel10">
            <div class="panel-title10 mono">第三步：步长与后续（背景，超出考试深度）</div>
            <div class="mathbox10">
              <div><span class="lbl">步长上限</span> λmax = sup{λ : gᵢ(x+λd) ≥ 0}</div>
              <div><span class="lbl">本例</span> g2(x+λd) = 2 − 2λ ≥ 0 ⇒ <span class="hi">λmax = 1</span></div>
              <div><span class="lbl">一维搜索得 λ₁ = 1 ⇒</span> x⁽²⁾ = (0,0) + 1·(1,1) = <span class="hi">(1, 1)ᵀ</span></div>
            </div>
            <div class="step10"><span class="sn">·</span><div class="st">再迭代一次到 <span class="mono">x* = (1/2, 3/2)ᵀ</span>，f* = 3/2（g2 起作用）</div></div>
            <div class="step10"><span class="sn">·</span><div class="st">老师口径：<b>考到"求可行下降方向"为止</b>，λmax / 完整迭代 / Rosen 的 d=0 分支均不考</div></div>
            <div class="verdict10 warn">易错：① 别跳过方向 LP 直接取 −∇f；② −1 ≤ dⱼ ≤ 1 这一栏别漏；③ 先判活动集再写 A₁。</div>
          </div>
        </div>
        <div class="right10">
          <div class="panel10">
            <div class="panel-title10 mono">五步速记</div>
            <div class="formcard10"><div class="fh">1</div><div class="fl">给定可行点 x，判<b>哪些约束起作用</b>，写 A₁（起作用）和 E（等号）</div></div>
            <div class="formcard10"><div class="fh">2</div><div class="fl">列方向 LP：<span class="mono">min ∇fᵀd s.t. A₁d ≥ 0，Ed = 0，−1 ≤ dⱼ ≤ 1</span></div></div>
            <div class="formcard10"><div class="fh">3</div><div class="fl">解出 d，验 <span class="mono">∇fᵀd &lt; 0</span>（下降）且方向可行</div></div>
            <div class="formcard10"><div class="fh">4</div><div class="fl">LP 最优值 = 0 ⇒ <b>当前点即 KKT</b>，停（证用 Farkas）</div></div>
            <div class="formcard10"><div class="fh">5</div><div class="fl">答句格式："非 KKT 点，可行下降方向 d = …"</div></div>
          </div>
        </div>
      </div>
    </div>

  <script>

    const steps = [
      { t: 0.15,  label: "1 / 5 · 导入",        text: "Zoutendijk：每一步先求一个既下降又可行的方向" },
      { t: 6.45,  label: "2 / 5 · 题意与几何",  text: "可行域四边形；初点 (0,0) 在原点，−∇f 指向域外" },
      { t: 15.45, label: "3 / 5 · 定活动集",    text: "g1、g2 都不起作用；起作用的是 x1=0、x2=0 ⇒ A₁ = I" },
      { t: 25.45, label: "4 / 5 · 方向 LP",     text: "min −2d1−4d2 s.t. d≥0, |d|≤1 ⇒ d = (1,1)，最优值 −6 < 0" },
      { t: 39.45, label: "5 / 5 · 步长与速记",  text: "λmax = 1，x⁽²⁾ = (1,1)；考到求方向为止；五步速记" },
    ];
